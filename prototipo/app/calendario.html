<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Presença Agro — Agenda</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone">
      <div class="phone-notch"></div>

      <div class="status-bar">
        <span>9:24</span>
        <span>📶 Starlink &nbsp; 🔋</span>
      </div>

      <header class="app-header">
        <a class="back-btn" href="../index.html" title="Voltar">←</a>
        <div>
          <h1>Minha Agenda</h1>
          <div class="subtitle" id="cal-sub">Semana de 20 a 26 de maio</div>
        </div>
      </header>

      <div class="screen">
        <div class="cal-header">
          <div class="cal-month">
            <h2>Maio 2026</h2>
            <div style="display:flex; gap:8px;">
              <button class="back-btn" style="background: var(--pa-green-light); color: var(--pa-green-dark)">‹</button>
              <button class="back-btn" style="background: var(--pa-green-light); color: var(--pa-green-dark)">›</button>
            </div>
          </div>
          <div class="cal-week" id="cal-week"></div>
        </div>

        <!-- SLA strip -->
        <div style="padding: 12px 16px 4px;">
          <h3 style="margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--pa-muted); font-weight:700;">
            Carteira por SLA
          </h3>
        </div>
        <div class="sla-strip">
          <div class="sla-pill"><span class="sem green"></span> 14 em dia</div>
          <div class="sla-pill"><span class="sem amber"></span> 5 chegando ao prazo</div>
          <div class="sla-pill"><span class="sem red"></span> 2 vencidas</div>
        </div>

        <div class="day-list" id="day-list"></div>
      </div>

      <nav class="tabbar">
        <a href="../index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 4l9 8"/><path d="M5 10v10h14V10"/></svg>
          Início
        </a>
        <a href="./visita.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Visita
        </a>
        <a href="#" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agenda
        </a>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
          Perfil
        </a>
      </nav>
    </div>
  </div>

  <script src="../assets/data.js"></script>
  <script src="../assets/calendario.js"></script>
</body>
</html>
